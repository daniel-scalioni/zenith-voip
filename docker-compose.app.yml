networks:
  ai-hub-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  zenith_ollama_data:
  zenith_smb_logs:
  # Gravação de chamadas em RAM (tmpfs), não no HD do sistema — combina com
  # a retenção curta (1h, ver arq-cleanup). Ver backlog Fase 1C.
  zenith_recordings_tmpfs:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=2g"

secrets:
  signalwire_token:
    file: ./freeswitch/signalwire_token.txt

services:
  zenith-freeswitch-config:
    image: python:3.12-slim
    container_name: zenith-freeswitch-config
    env_file: .env
    volumes:
      - ./scripts:/app/scripts:ro
      - ./freeswitch/conf/autoload_configs:/output
    command:
      - python
      - /app/scripts/render_freeswitch_secrets.py
      - --output
      - /output/xml_curl.conf.xml
    restart: "no"

  freeswitch:
    # Build customizado restaurado (feature 007-audio-stream-migration):
    # mod_audio_fork foi substituído por mod_audio_stream, que não depende
    # mais do repositório SignalWire estar sempre disponível (.deb
    # vendorizados em freeswitch/vendor/debs/). Ver GAP-11 em
    # _reversa_sdd/gaps.md.
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
      secrets:
        - signalwire_token
    container_name: zenith-freeswitch
    network_mode: host
    volumes:
      - ./freeswitch/conf:/etc/freeswitch
      - ./audio:/usr/share/freeswitch/sounds/zenith
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - SYS_RESOURCE
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      zenith-freeswitch-config:
        condition: service_completed_successfully
    # Healthcheck próprio (GAP-24) — substitui o genérico da imagem base, que
    # não sabe nada sobre módulos do projeto. Sem isso, a imagem rodou 24h
    # "healthy" em produção sem mod_audio_stream carregado, sem nenhum sinal.
    # start_period alto porque o profile upstream carrega ~939 gateways no
    # boot e pode não aceitar comandos ESL/CLI nos primeiros segundos.
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -x 'module_exists mod_audio_stream' | grep -q true && fs_cli -x 'module_exists mod_xml_curl' | grep -q true"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  fastapi-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenith-api-1
    hostname: zenith-api-1
    networks:
      - ai-hub-net
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    environment:
      - INSTANCE_ID=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:?defina DATABASE_URL com a senha URL-encoded}
      - FREESWITCH_ESL_HOST=172.21.0.1
      - FREESWITCH_ESL_PORT=8021
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - OLLAMA_URL=http://ollama:11434
      - RECORDINGS_PATH=/data/recordings
      - RECORDING_MAX_CALL_SECONDS=${RECORDING_MAX_CALL_SECONDS:-300}
      - RECORDING_MIN_FREE_PERCENT=${RECORDING_MIN_FREE_PERCENT:-20}
      - RECORDING_RESUME_FREE_PERCENT=${RECORDING_RESUME_FREE_PERCENT:-30}
      - RECORDING_PROCESSING_HEADROOM_BYTES=${RECORDING_PROCESSING_HEADROOM_BYTES:-134217728}
      - RECORDING_LEASE_TTL_SECONDS=${RECORDING_LEASE_TTL_SECONDS:-120}
      - RECORDING_LEASE_HEARTBEAT_SECONDS=${RECORDING_LEASE_HEARTBEAT_SECONDS:-30}
    volumes:
      - ./src:/app/src
      - zenith_recordings_tmpfs:/data/recordings
      - ./freeswitch/conf/directory/extensions.xml:/run/zenith-directory/extensions.xml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  fastapi-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenith-api-2
    hostname: zenith-api-2
    networks:
      - ai-hub-net
    ports:
      - "127.0.0.1:8002:8000"
    env_file: .env
    environment:
      - INSTANCE_ID=2
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:?defina DATABASE_URL com a senha URL-encoded}
      - FREESWITCH_ESL_HOST=172.21.0.1
      - FREESWITCH_ESL_PORT=8021
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - OLLAMA_URL=http://ollama:11434
      - RECORDINGS_PATH=/data/recordings
      - RECORDING_MAX_CALL_SECONDS=${RECORDING_MAX_CALL_SECONDS:-300}
      - RECORDING_MIN_FREE_PERCENT=${RECORDING_MIN_FREE_PERCENT:-20}
      - RECORDING_RESUME_FREE_PERCENT=${RECORDING_RESUME_FREE_PERCENT:-30}
      - RECORDING_PROCESSING_HEADROOM_BYTES=${RECORDING_PROCESSING_HEADROOM_BYTES:-134217728}
      - RECORDING_LEASE_TTL_SECONDS=${RECORDING_LEASE_TTL_SECONDS:-120}
      - RECORDING_LEASE_HEARTBEAT_SECONDS=${RECORDING_LEASE_HEARTBEAT_SECONDS:-30}
    volumes:
      - ./src:/app/src
      - zenith_recordings_tmpfs:/data/recordings
      - ./freeswitch/conf/directory/extensions.xml:/run/zenith-directory/extensions.xml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  arq-uploader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenith-arq-uploader
    networks:
      - ai-hub-net
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:?defina DATABASE_URL com a senha URL-encoded}
      - RECORDINGS_PATH=/data/recordings
      - RECORDING_LEASE_TTL_SECONDS=${RECORDING_LEASE_TTL_SECONDS:-120}
      - RECORDING_LEASE_HEARTBEAT_SECONDS=${RECORDING_LEASE_HEARTBEAT_SECONDS:-30}
    volumes:
      - ./src:/app/src
      - zenith_recordings_tmpfs:/data/recordings
    command: ["arq", "src.workers.audio_uploader.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  arq-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenith-arq-cleanup
    networks:
      - ai-hub-net
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:?defina DATABASE_URL com a senha URL-encoded}
      # ~2 horas para cobrir retries do backup SMB.
      - AUDIO_RETENTION_DAYS=${AUDIO_RETENTION_DAYS:-0.0833}
      - RECORDINGS_PATH=/data/recordings
      - RECORDING_REQUIRED_CONSUMERS=${RECORDING_REQUIRED_CONSUMERS:-["smb"]}
      - RECORDING_CLEANUP_ROUND_SECONDS=${RECORDING_CLEANUP_ROUND_SECONDS:-900}
      - RECORDING_LEASE_TTL_SECONDS=${RECORDING_LEASE_TTL_SECONDS:-120}
    volumes:
      - ./src:/app/src
      - zenith_recordings_tmpfs:/data/recordings
    command: ["arq", "src.workers.audio_cleanup.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  smb-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenith-smb-sync
    networks:
      - ai-hub-net
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:?defina DATABASE_URL com a senha URL-encoded}
      - RECORDINGS_PATH=/data/recordings
      - RECORDING_CLEANUP_ROUND_SECONDS=${RECORDING_CLEANUP_ROUND_SECONDS:-900}
      - RECORDING_LEASE_TTL_SECONDS=${RECORDING_LEASE_TTL_SECONDS:-120}
      - RECORDING_LEASE_HEARTBEAT_SECONDS=${RECORDING_LEASE_HEARTBEAT_SECONDS:-30}
      - SMB_TRANSFER_LOG_PATH=/data/smb_logs/smb_transfer_log.json
    volumes:
      - ./src:/app/src
      - zenith_recordings_tmpfs:/data/recordings
      - zenith_smb_logs:/data/smb_logs
    command: ["arq", "src.workers.smb_sync.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ip-watcher:
    build: ./sidecar
    container_name: zenith-ip-watcher
    network_mode: host
    volumes:
      - ./freeswitch/conf:/etc/freeswitch
    env_file: .env
    environment:
      - EXTERNAL_IP_ENDPOINT=${EXTERNAL_IP_ENDPOINT}
      - FREESWITCH_ESL_HOST=127.0.0.1
      - FREESWITCH_ESL_PORT=8021
      - FREESWITCH_ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD:-ClueCon}
      - FREESWITCH_CONF_PATH=/etc/freeswitch
      - MOCK_EXTERNAL_IP=${MOCK_EXTERNAL_IP:-}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
      - SSL_VERIFY=${SSL_VERIFY:-true}
    depends_on:
      - freeswitch
    restart: unless-stopped

  bunkerweb:
    image: bunkerity/bunkerweb:1.5.12
    container_name: zenith-bunkerweb
    networks:
      - ai-hub-net
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_NAME=zenith.local
      - USE_REVERSE_PROXY=yes
      - REVERSE_PROXY_URL=/
      - REVERSE_PROXY_HOST=http://fastapi-1:8000
      - MULTISITE=yes
      - API_WHITELIST_IP=172.21.0.0/16
      - USE_CUSTOM_HEADERS=yes
      - CUSTOM_HEADERS=X-Call-ID $http_x_call_id
      - STICKY_SESSION=yes
      - STICKY_SESSION_NAME=X-Call-ID
    volumes:
      - ./bunkerweb:/etc/bunkerweb/configs
    depends_on:
      - fastapi-1
      - fastapi-2
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.7
    container_name: zenith-ollama
    networks:
      - ai-hub-net
    ports:
      - "11434:11434"
    volumes:
      - zenith_ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  # Serviço piper-tts removido (feature 008-piper-tts-standalone): a imagem
  # rhasspy/piper-tts:2023.11.14 nunca existiu (GAP-18). TTS agora roda como
  # processo local via API Python do pacote piper-tts (ver
  # src/services/tts_service.py), sem microserviço separado.
