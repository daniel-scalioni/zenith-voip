name: zenith-quality

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: zenith-postgres-test
    environment:
      POSTGRES_USER: zenith_test
      POSTGRES_PASSWORD: ${ZENITH_TEST_POSTGRES_PASSWORD:?defina ZENITH_TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: zenith_test_admin
    volumes:
      - zenith-postgres-test-data:/var/lib/postgresql/data
    networks:
      - zenith-quality-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith_test -d zenith_test_admin"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  quality-runner:
    build:
      context: .
      dockerfile: Dockerfile.quality
    container_name: zenith-quality-runner
    environment:
      DATABASE_URL: postgresql+asyncpg://zenith_test:${ZENITH_TEST_POSTGRES_PASSWORD:?defina ZENITH_TEST_POSTGRES_PASSWORD}@zenith-postgres-test:5432/zenith_test_admin
      ZENITH_TEST_DATABASE_HOST: zenith-postgres-test
      ZENITH_TEST_DATABASE_NAME: zenith_test_admin
    volumes:
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    networks:
      - zenith-quality-test-net
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["sleep", "infinity"]
    restart: "no"

  postgres-rehearsal:
    image: postgres:16-alpine
    container_name: zenith-postgres-rehearsal
    environment:
      POSTGRES_USER: zenith_rehearsal
      POSTGRES_PASSWORD: ${ZENITH_REHEARSAL_POSTGRES_PASSWORD:?defina ZENITH_REHEARSAL_POSTGRES_PASSWORD}
      POSTGRES_DB: zenith_rehearsal
    volumes:
      - zenith-postgres-rehearsal-data:/var/lib/postgresql/data
    networks:
      - zenith-quality-rehearsal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith_rehearsal -d zenith_rehearsal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

volumes:
  zenith-postgres-test-data:
    name: zenith-postgres-test-data
  zenith-postgres-rehearsal-data:
    name: zenith-postgres-rehearsal-data

networks:
  zenith-quality-test-net:
    name: zenith-quality-test-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  zenith-quality-rehearsal-net:
    name: zenith-quality-rehearsal-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
